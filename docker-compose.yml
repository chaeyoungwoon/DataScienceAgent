version: "3.9"

services:
  app:
    build: .
    image: datascienceagent:latest
    env_file: .env
    environment:
      - MPLBACKEND=Agg
      - TRANSFORMERS_CACHE=/cache/huggingface
      - HF_HOME=/cache/huggingface
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./context:/app/context
      - ./logs:/app/logs
      - hf_cache:/cache/huggingface

volumes:
  hf_cache:
